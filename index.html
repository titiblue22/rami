<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rami</title>
<style>
  :root{
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --blue:#007AFF;
    --red:#FF3B30;
    --green:#34C759;
    --gray:#8E8E93;
    --gray-light:#C7C7CC;
    --separator:#E5E5EA;
    --text:#1C1C1E;
  }
  body.dark{
    --bg:#0B0B0F;
    --card:#1C1C1E;
    --blue:#D4AF37;
    --red:#FF453A;
    --green:#30D158;
    --gray:#8E8E93;
    --gray-light:#3A3A3C;
    --separator:#2C2C2E;
    --text:#F2F2F7;
  }
  body.dark .navbar{
    background:rgba(11,11,15,0.85);
  }
  body.dark .tabbar{
    background:rgba(28,28,30,0.9);
  }
  body.dark .dealer-btn{
    color:#D4AF37;
  }
  body.dark .btn{
    color:#0B0B0F;
  }
  body.dark .btn.secondary{
    color:#D4AF37;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color:var(--text);
    overscroll-behavior:none;
  }
  .navbar{
    position:sticky; top:0; z-index:10;
    background:rgba(242,242,247,0.85);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
    text-align:center;
    border-bottom:0.5px solid var(--separator);
    transition:background 0.2s;
  }
  .navbar h1{
    margin:0;
    font-size:17px;
    font-weight:600;
  }
  .navbar .sub{
    font-size:13px;
    color:var(--gray);
    margin-top:2px;
  }
  .container{
    max-width:520px;
    margin:0 auto;
    padding:16px 16px 120px;
  }
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    color:var(--gray);
    margin:20px 6px 8px;
    letter-spacing:0.03em;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .row{
    display:flex;
    align-items:center;
    padding:12px 14px;
    border-bottom:0.5px solid var(--separator);
    gap:10px;
  }
  .row:last-child{ border-bottom:none; }
  .player-name{
    flex:1;
    font-size:16px;
    font-weight:500;
  }
  .player-score{
    font-size:17px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    min-width:40px;
    text-align:right;
  }
  .dealer-btn{
    border:none;
    background:var(--separator);
    color:var(--gray);
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
  }
  .dealer-btn.active{
    background:var(--blue);
    color:#fff;
  }
  .remove-btn{
    border:none;
    background:none;
    color:var(--red);
    font-size:20px;
    line-height:1;
    padding:0 2px;
  }
  .add-row{
    display:flex;
    gap:8px;
    padding:14px;
  }
  .add-row input{
    flex:1;
    border:none;
    background:var(--bg);
    border-radius:10px;
    padding:10px 12px;
    font-size:16px;
    outline:none;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-size:16px;
    font-weight:600;
    background:var(--blue);
    color:#fff;
  }
  .btn:disabled{ background:var(--gray-light); }
  .btn.secondary{
    background:var(--separator);
    color:var(--blue);
  }
  .rounds-list .row{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:6px;
  }
  .round-header{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--gray);
    font-weight:600;
  }
  .round-scores{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    font-size:15px;
  }
  .round-scores span b{ font-variant-numeric:tabular-nums; }
  .rank-num{
    width:22px;
    text-align:center;
    font-size:15px;
    color:var(--gray);
    font-weight:600;
  }
  .row.leader .rank-num{ color:var(--blue); }
  .empty{
    text-align:center;
    color:var(--gray);
    font-size:14px;
    padding:30px 10px;
  }
  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:0.5px solid var(--separator);
    padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
    display:flex;
    gap:10px;
    max-width:520px;
    margin:0 auto;
  }
  .tabbar .btn{ flex:1; }

  /* Sheet modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.35);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background:var(--card);
    width:100%;
    max-width:520px;
    margin:0 auto;
    border-radius:16px 16px 0 0;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);
    max-height:80vh;
    overflow-y:auto;
    animation:slideUp 0.25s ease-out;
  }
  @keyframes slideUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  .sheet-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0 14px;
  }
  .sheet-header h2{
    font-size:17px;
    margin:0;
  }
  .sheet-header button{
    border:none;
    background:none;
    font-size:16px;
    color:var(--blue);
  }
  .score-input-row{
    display:flex;
    align-items:center;
    padding:10px 4px;
    border-bottom:0.5px solid var(--separator);
    gap:10px;
  }
  .score-input-row:last-of-type{ border-bottom:none; }
  .score-input-row label{ flex:1; font-size:16px; }
  .stepper{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stepper button{
    width:30px;
    height:30px;
    border:none;
    border-radius:8px;
    background:var(--bg);
    color:var(--blue);
    font-size:18px;
    font-weight:600;
    line-height:1;
  }
  .stepper button:active{ background:var(--separator); }
  .stepper input{
    width:60px;
    text-align:center;
    border:none;
    background:var(--bg);
    border-radius:10px;
    padding:8px 4px;
    font-size:16px;
    outline:none;
  }
</style>
</head>
<body>

<div class="navbar">
  <button id="themeToggle" style="position:absolute; right:16px; top:calc(env(safe-area-inset-top) + 12px); border:none; background:none; font-size:20px;">🌙</button>
  <h1>Rami</h1>
  <div class="sub" id="roundCount">Aucune manche jouée</div>
</div>

<div class="container">

  <div class="section-title">Joueurs</div>
  <div class="card">
    <div id="playersList"></div>
    <div class="add-row">
      <input type="text" id="newPlayerName" placeholder="Nom du joueur" maxlength="20">
      <button class="btn" id="addPlayerBtn">Ajouter</button>
    </div>
  </div>

  <div class="section-title">Classement</div>
  <div class="card" id="rankingCard"></div>

  <div class="section-title">Manches</div>
  <div class="card rounds-list" id="roundsList">
    <div class="empty">Aucune manche pour l'instant</div>
  </div>

</div>

<div class="tabbar">
  <button class="btn secondary" id="resetBtn">Réinitialiser</button>
  <button class="btn" id="newRoundBtn">Nouvelle manche</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-header">
      <button id="cancelRoundBtn">Annuler</button>
      <h2>Manche <span id="roundNumberLabel"></span></h2>
      <button id="validateRoundBtn"><b>OK</b></button>
    </div>
    <div id="scoreInputs"></div>
  </div>
</div>

<script>
  let players = []; // {id, name, isDealer}
  let rounds = []; // [{scores: {playerId: score}}]
  let nextId = 1;

  const playersList = document.getElementById('playersList');
  const roundsList = document.getElementById('roundsList');
  const roundCount = document.getElementById('roundCount');
  const overlay = document.getElementById('overlay');
  const scoreInputs = document.getElementById('scoreInputs');
  const roundNumberLabel = document.getElementById('roundNumberLabel');
  const rankingCard = document.getElementById('rankingCard');
  let editingIndex = null; // index de la manche en cours d'édition, null = nouvelle manche

  function totalFor(playerId){
    return rounds.reduce((sum, r) => sum + (r.scores[playerId] || 0), 0);
  }

  function render(){
    // players
    if(players.length === 0){
      playersList.innerHTML = '';
    } else {
      playersList.innerHTML = players.map(p => `
        <div class="row">
          <button class="dealer-btn ${p.isDealer ? 'active' : ''}" data-dealer="${p.id}">🃏 Donneur</button>
          <div class="player-name">${p.name}</div>
          <div class="player-score">${totalFor(p.id)}</div>
          <button class="remove-btn" data-remove="${p.id}">✕</button>
        </div>
      `).join('');
    }

    // classement (score le plus bas = gagnant)
    if(players.length === 0){
      rankingCard.innerHTML = '<div class="empty">Ajoute des joueurs</div>';
    } else {
      const ranked = [...players].sort((a,b) => totalFor(b.id) - totalFor(a.id));
      const maxScore = totalFor(ranked[0].id);
      rankingCard.innerHTML = ranked.map((p, i) => `
        <div class="row ${totalFor(p.id) === maxScore ? 'leader' : ''}">
          <div class="rank-num">${i+1}${totalFor(p.id) === maxScore && rounds.length > 0 ? ' 👑' : ''}</div>
          <div class="player-name">${p.name}</div>
          <div class="player-score">${totalFor(p.id)}</div>
        </div>
      `).join('');
    }

    // rounds
    if(rounds.length === 0){
      roundsList.innerHTML = '<div class="empty">Aucune manche pour l\'instant</div>';
    } else {
      roundsList.innerHTML = rounds.map((r, i) => `
        <div class="row" data-edit-round="${i}">
          <div class="round-header"><span>Manche ${i+1}</span><span>${r.dealerName ? '🃏 ' + r.dealerName : ''}</span></div>
          <div class="round-scores">
            ${players.map(p => `<span>${p.name}: <b>${r.scores[p.id] ?? 0}</b></span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    roundCount.textContent = rounds.length === 0
      ? 'Aucune manche jouée'
      : rounds.length + ' manche' + (rounds.length > 1 ? 's' : '') + ' jouée' + (rounds.length > 1 ? 's' : '');
  }

  document.getElementById('addPlayerBtn').addEventListener('click', () => {
    const input = document.getElementById('newPlayerName');
    const name = input.value.trim();
    if(!name) return;
    players.push({ id: nextId++, name, isDealer: players.length === 0 });
    input.value = '';
    render();
  });

  document.getElementById('newPlayerName').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('addPlayerBtn').click();
  });

  playersList.addEventListener('click', (e) => {
    const dealerId = e.target.closest('[data-dealer]')?.dataset.dealer;
    const removeId = e.target.closest('[data-remove]')?.dataset.remove;
    if(dealerId){
      const id = parseInt(dealerId);
      players.forEach(p => p.isDealer = (p.id === id));
      render();
    }
    if(removeId){
      const id = parseInt(removeId);
      players = players.filter(p => p.id !== id);
      render();
    }
  });

  function openRoundSheet(index){
    editingIndex = index;
    const existing = index !== null ? rounds[index] : null;
    roundNumberLabel.textContent = (index !== null ? index + 1 : rounds.length + 1);
    scoreInputs.innerHTML = players.map(p => `
      <div class="score-input-row">
        <label>${p.name}</label>
        <div class="stepper">
          <button type="button" data-step="-1" data-target="${p.id}">−</button>
          <input type="number" inputmode="numeric" data-score="${p.id}" value="${existing ? (existing.scores[p.id] ?? 0) : 0}">
          <button type="button" data-step="1" data-target="${p.id}">+</button>
        </div>
      </div>
    `).join('');
    overlay.classList.add('show');
  }

  document.getElementById('newRoundBtn').addEventListener('click', () => {
    if(players.length < 2){
      alert('Ajoute au moins 2 joueurs pour commencer une manche.');
      return;
    }
    openRoundSheet(null);
  });

  roundsList.addEventListener('click', (e) => {
    const idx = e.target.closest('[data-edit-round]')?.dataset.editRound;
    if(idx !== undefined) openRoundSheet(parseInt(idx));
  });

  scoreInputs.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-step]');
    if(!btn) return;
    const step = parseInt(btn.dataset.step);
    const input = scoreInputs.querySelector(`input[data-score="${btn.dataset.target}"]`);
    input.value = (parseInt(input.value) || 0) + step;
  });

  document.getElementById('cancelRoundBtn').addEventListener('click', () => {
    editingIndex = null;
    overlay.classList.remove('show');
  });

  document.getElementById('validateRoundBtn').addEventListener('click', () => {
    const scores = {};
    scoreInputs.querySelectorAll('[data-score]').forEach(input => {
      scores[parseInt(input.dataset.score)] = parseInt(input.value) || 0;
    });
    if(editingIndex !== null){
      rounds[editingIndex].scores = scores;
    } else {
      const dealer = players.find(p => p.isDealer);
      rounds.push({ scores, dealerName: dealer ? dealer.name : null });
    }
    editingIndex = null;
    overlay.classList.remove('show');
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm('Réinitialiser la partie ? Les joueurs et manches seront effacés.')){
      players = [];
      rounds = [];
      render();
    }
  });

  render();
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  });



</body>
</html>
