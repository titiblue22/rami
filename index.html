<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#8e8e93;
  --accent:#c0392b; --accent2:#c9a227; --sep:#e5e5ea; --danger:#ff3b30;
  --dealer:#c9a227; --shadow:rgba(0,0,0,0.06);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#0b0b0d; --card:#17181b; --text:#f2f2f2; --sub:#8e8e93;
  --accent:#e0483e; --accent2:#d4af37; --sep:#2c2c2e; --danger:#ff453a;
  --dealer:#d4af37; --shadow:rgba(0,0,0,0.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--text); padding-bottom:60px; transition:background .3s,color .3s;
}
header{
  position:sticky; top:0; z-index:10; background:var(--bg); padding:14px 16px 8px;
  display:flex; align-items:center; justify-content:space-between; backdrop-filter:blur(10px);
}
h1{font-size:22px; margin:0; font-weight:700; letter-spacing:-0.3px;}
.theme-btn{
  border:none; background:var(--card); color:var(--text); width:38px; height:38px; border-radius:50%;
  font-size:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px var(--shadow);
}
.container{padding:0 16px; max-width:640px; margin:0 auto;}
.card{
  background:var(--card); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
  box-shadow:0 1px 3px var(--shadow);
}
.card h2{font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--sub); margin:0 0 10px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0;}
.row + .row{border-top:1px solid var(--sep);}
input[type="text"], input[type="number"], input[type="date"]{
  font-size:16px; border:1px solid var(--sep); background:transparent; color:var(--text);
  border-radius:10px; padding:9px 12px; width:100%; font-family:inherit;
}
.btn{
  border:none; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:600; cursor:pointer;
  background:var(--accent); color:#fff; transition:opacity .15s;
}
.btn:active{opacity:.7;}
.btn.secondary{background:var(--sep); color:var(--text);}
.btn.danger{background:var(--danger); color:#fff;}
.btn.small{padding:6px 10px; font-size:13px; border-radius:8px;}
.btn.pill{border-radius:20px;}
.btn:disabled{opacity:.35; cursor:default;}
.icon-btn{
  border:none; background:transparent; color:var(--sub); font-size:18px; padding:4px 8px; cursor:pointer;
}
.icon-btn.danger{color:var(--danger);}
.chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--sep);
  border-radius:20px; padding:6px 12px; font-size:14px; cursor:pointer; user-select:none;
}
.chip.selected{background:var(--accent); border-color:var(--accent); color:#fff;}
.chip.dealer-tag{background:var(--dealer); border-color:var(--dealer); color:#1c1c1e; font-weight:700;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.player-name{font-size:16px; font-weight:500;}
.empty{color:var(--sub); font-size:14px; text-align:center; padding:20px 0;}
.score-input-row{display:flex; align-items:center; gap:10px;}
.score-input-row .player-name{flex:1;}
.score-input-row input{width:90px; text-align:right;}
.dealer-toggle{
  border:1px solid var(--sep); background:transparent; color:var(--sub); border-radius:8px;
  width:34px; height:34px; font-size:16px; cursor:pointer;
}
.dealer-toggle.active{background:var(--dealer); border-color:var(--dealer); color:#1c1c1e;}
table{width:100%; border-collapse:collapse; font-size:14px;}
th,td{padding:6px 4px; text-align:center; border-bottom:1px solid var(--sep);}
th:first-child, td:first-child{text-align:left;}
.rank-row{display:flex; align-items:center; justify-content:space-between; padding:10px 6px; border-radius:10px;}
.rank-row.winner{background:linear-gradient(90deg, var(--dealer), transparent 90%); }
.rank-left{display:flex; align-items:center; gap:10px;}
.rank-pos{width:22px; height:22px; border-radius:50%; background:var(--sep); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
.rank-row.winner .rank-pos{background:var(--dealer); color:#1c1c1e;}
.rank-score{font-weight:700; font-size:16px;}
.tabs{display:flex; gap:8px; margin-bottom:14px;}
.tab{flex:1; text-align:center; padding:10px; border-radius:10px; background:var(--card); color:var(--sub); font-weight:600; font-size:14px; cursor:pointer; box-shadow:0 1px 3px var(--shadow);}
.tab.active{background:var(--accent); color:#fff;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:flex-end;
  justify-content:center; z-index:100;
}
.modal{
  background:var(--card); width:100%; max-width:640px; border-radius:20px 20px 0 0; padding:20px;
  animation:slideup .25s ease-out;
}
@keyframes slideup{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal h3{margin:0 0 14px; font-size:18px;}
.modal-actions{display:flex; gap:10px; margin-top:16px;}
.modal-actions .btn{flex:1;}
.stat-row{display:flex; justify-content:space-between; padding:8px 0; font-size:14px;}
.stat-row + .stat-row{border-top:1px solid var(--sep);}
.section-title{font-size:20px; font-weight:700; margin:6px 0 12px;}
.history-item{padding:10px 0;}
.history-item + .history-item{border-top:1px solid var(--sep);}
.history-head{display:flex; justify-content:space-between; align-items:center;}
.history-head .date{font-weight:600;}
.history-head .sub{color:var(--sub); font-size:13px;}
select{font-size:16px; border:1px solid var(--sep); background:var(--card); color:var(--text); border-radius:10px; padding:9px 12px; width:100%;}
.date-row{display:flex; align-items:center; gap:10px;}
.date-row input{max-width:200px;}
</style>
</head>
<body>

<header>
  <h1>🃏 Rami</h1>
  <button class="theme-btn" id="themeBtn">🌙</button>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="game">Partie</div>
    <div class="tab" data-tab="history">Historique</div>
    <div class="tab" data-tab="stats">Stats</div>
  </div>

  <!-- GAME TAB -->
  <div id="tab-game">
    <div class="card">
      <h2>Joueurs</h2>
      <div id="playersList"></div>
      <div class="row" style="border-top:none; margin-top:6px;">
        <input type="text" id="newPlayerName" placeholder="Nom du joueur">
        <button class="btn" id="addPlayerBtn">Ajouter</button>
      </div>
    </div>

    <div class="card">
      <h2>Partie en cours</h2>
      <div class="date-row">
        <input type="date" id="gameDate">
        <button class="btn secondary" id="newGameBtn">Nouvelle partie</button>
      </div>
    </div>

    <div class="card">
      <h2>Classement</h2>
      <div id="ranking"></div>
    </div>

    <div class="card">
      <h2>Manches</h2>
      <button class="btn pill" id="newRoundBtn" style="margin-bottom:12px;">+ Nouvelle manche</button>
      <div id="roundsList"></div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" style="display:none;">
    <div class="card">
      <h2>Parties précédentes</h2>
      <div id="historyList"></div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn secondary" id="exportBtn" style="flex:1;">Exporter (JSON)</button>
        <button class="btn danger" id="clearHistoryBtn" style="flex:1;">Supprimer l'historique</button>
      </div>
    </div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" style="display:none;">
    <div class="card">
      <h2>Statistiques par joueur</h2>
      <div id="statsList"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
const STORAGE_KEY = 'rami_state_v1';

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){}
  }
  return {
    theme:'light',
    players:[],
    currentGame:{ id:genId(), date:todayStr(), rounds:[] },
    history:[]
  };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

let state = loadState();

// THEME
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').textContent = state.theme==='dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  saveState(); applyTheme();
});

// TABS
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    ['game','history','stats'].forEach(name=>{
      document.getElementById('tab-'+name).style.display = (name===t.dataset.tab)?'block':'none';
    });
    if(t.dataset.tab==='history') renderHistory();
    if(t.dataset.tab==='stats') renderStats();
  });
});

// PLAYERS (independent of rounds/games)
function renderPlayers(){
  const el = document.getElementById('playersList');
  if(state.players.length===0){
    el.innerHTML = '<div class="empty">Aucun joueur pour le moment</div>';
    return;
  }
  el.innerHTML = state.players.map(p=>`
    <div class="row">
      <span class="player-name">${escapeHtml(p.name)}</span>
      <button class="icon-btn danger" onclick="removePlayer('${p.id}')">✕</button>
    </div>
  `).join('');
}
function addPlayer(){
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if(!name) return;
  state.players.push({id:genId(), name});
  input.value='';
  saveState(); renderPlayers(); renderRanking(); renderRounds();
}
function removePlayer(id){
  showConfirm('Supprimer ce joueur ? Ses scores dans les manches enregistrées seront conservés.', ()=>{
    state.players = state.players.filter(p=>p.id!==id);
    saveState(); renderPlayers(); renderRanking(); renderRounds();
  });
}
document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
document.getElementById('newPlayerName').addEventListener('keydown', e=>{ if(e.key==='Enter') addPlayer(); });

// GAME DATE / NEW GAME
document.getElementById('gameDate').addEventListener('change', e=>{
  state.currentGame.date = e.target.value;
  saveState();
});
document.getElementById('newGameBtn').addEventListener('click', ()=>{
  showConfirm("Démarrer une nouvelle partie ? La partie en cours sera archivée dans l'historique.", ()=>{
    if(state.currentGame.rounds.length>0){
      state.history.unshift(state.currentGame);
    }
    state.currentGame = { id:genId(), date:todayStr(), rounds:[] };
    saveState();
    renderAll();
  });
});

// ROUNDS
function playerName(id){
  const p = state.players.find(p=>p.id===id);
  return p ? p.name : '(joueur supprimé)';
}

function renderRounds(){
  const el = document.getElementById('roundsList');
  const rounds = state.currentGame.rounds;
  if(rounds.length===0){
    el.innerHTML = '<div class="empty">Aucune manche enregistrée</div>';
    return;
  }
  el.innerHTML = rounds.map((r,idx)=>`
    <div class="card" style="background:var(--bg); box-shadow:none; border:1px solid var(--sep);">
      <div class="row" style="border-top:none;">
        <strong>Manche ${idx+1}</strong>
        <div>
          <button class="icon-btn" onclick="editRound('${r.id}')">✏️</button>
          <button class="icon-btn danger" onclick="deleteRound('${r.id}')">🗑️</button>
        </div>
      </div>
      <table>
        <tr><th>Joueur</th><th>Score</th><th>Donneur</th></tr>
        ${r.participants.map(pid=>`
          <tr>
            <td>${escapeHtml(playerName(pid))}</td>
            <td>${r.scores[pid] ?? 0}</td>
            <td>${r.dealerId===pid ? '🎴' : ''}</td>
          </tr>
        `).join('')}
      </table>
    </div>
  `).join('');
}

function renderRanking(){
  const el = document.getElementById('ranking');
  const totals = {};
  state.players.forEach(p=> totals[p.id]=0 );
  state.currentGame.rounds.forEach(r=>{
    r.participants.forEach(pid=>{
      if(!(pid in totals)) totals[pid]=0;
      totals[pid] += Number(r.scores[pid]||0);
    });
  });
  const ranked = Object.keys(totals)
    .map(pid=>({pid, total:totals[pid]}))
    .sort((a,b)=>b.total-a.total);
  if(ranked.length===0){
    el.innerHTML = '<div class="empty">Ajoutez des joueurs et des manches</div>';
    return;
  }
  el.innerHTML = ranked.map((r,idx)=>`
    <div class="rank-row ${idx===0 && r.total>0 ? 'winner':''}">
      <div class="rank-left">
        <div class="rank-pos">${idx+1}</div>
        <div class="player-name">${escapeHtml(playerName(r.pid))}${idx===0 && r.total>0 ? ' 👑':''}</div>
      </div>
      <div class="rank-score">${r.total}</div>
    </div>
  `).join('');
}

function newRoundModal(){
  if(state.players.length===0){
    showAlert('Ajoutez au moins un joueur avant de créer une manche.');
    return;
  }
  let selected = new Set(state.players.map(p=>p.id));
  let dealerId = null;

  const body = `
    <h3>Nouvelle manche</h3>
    <div class="chips" id="playerChips"></div>
    <p style="color:var(--sub); font-size:13px; margin-top:14px;">Touchez un joueur pour désigner le donneur.</p>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelRound">Annuler</button>
      <button class="btn" id="confirmRound">Créer la manche</button>
    </div>
  `;
  openModal(body, ()=>{
    function renderChips(){
      document.getElementById('playerChips').innerHTML = state.players.map(p=>`
        <div class="chip ${selected.has(p.id)?'selected':''} ${dealerId===p.id?'dealer-tag':''}" data-id="${p.id}">
          ${escapeHtml(p.name)}${dealerId===p.id?' 🎴':''}
        </div>
      `).join('');
      document.querySelectorAll('#playerChips .chip').forEach(chip=>{
        let pressTimer;
        chip.addEventListener('click', ()=>{
          const id = chip.dataset.id;
          if(selected.has(id)) selected.delete(id); else { selected.add(id); }
          if(!selected.has(id) && dealerId===id) dealerId=null;
          renderChips();
        });
        chip.addEventListener('dblclick', ()=>{
          const id = chip.dataset.id;
          if(!selected.has(id)) return;
          dealerId = (dealerId===id) ? null : id;
          renderChips();
        });
      });
    }
    renderChips();
    document.getElementById('cancelRound').addEventListener('click', closeModal);
    document.getElementById('confirmRound').addEventListener('click', ()=>{
      const participants = Array.from(selected);
      if(participants.length===0){ showAlert('Sélectionnez au moins un joueur.'); return; }
      const scores = {};
      participants.forEach(pid=> scores[pid]=0 );
      state.currentGame.rounds.push({ id:genId(), participants, dealerId, scores });
      saveState();
      closeModal();
      renderRounds(); renderRanking();
      editRound(state.currentGame.rounds[state.currentGame.rounds.length-1].id);
    });
  });
}
document.getElementById('newRoundBtn').addEventListener('click', newRoundModal);

function editRound(roundId){
  const round = state.currentGame.rounds.find(r=>r.id===roundId);
  if(!round) return;
  const body = `
    <h3>Modifier la manche</h3>
    <div id="scoreRows"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelEdit">Annuler</button>
      <button class="btn" id="saveEdit">Enregistrer</button>
    </div>
  `;
  openModal(body, ()=>{
    const el = document.getElementById('scoreRows');
    el.innerHTML = round.participants.map(pid=>`
      <div class="score-input-row" style="margin-bottom:10px;">
        <button class="dealer-toggle ${round.dealerId===pid?'active':''}" data-dealer="${pid}">🎴</button>
        <span class="player-name">${escapeHtml(playerName(pid))}</span>
        <input type="number" inputmode="numeric" data-score="${pid}" value="${round.scores[pid] ?? 0}">
      </div>
    `).join('');
    el.querySelectorAll('[data-dealer]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const pid = btn.dataset.dealer;
        round.dealerId = (round.dealerId===pid) ? null : pid;
        el.querySelectorAll('[data-dealer]').forEach(b=>b.classList.toggle('active', b.dataset.dealer===round.dealerId));
      });
    });
    document.getElementById('cancelEdit').addEventListener('click', closeModal);
    document.getElementById('saveEdit').addEventListener('click', ()=>{
      el.querySelectorAll('[data-score]').forEach(input=>{
        round.scores[input.dataset.score] = Number(input.value)||0;
      });
      saveState();
      closeModal();
      renderRounds(); renderRanking();
    });
  });
}

function deleteRound(roundId){
  showConfirm('Supprimer cette manche ? Cette action est irréversible.', ()=>{
    state.currentGame.rounds = state.currentGame.rounds.filter(r=>r.id!==roundId);
    saveState();
    renderRounds(); renderRanking();
  });
}

// HISTORY
const expandedGames = new Set();

function renderHistory(){
  const el = document.getElementById('historyList');
  if(state.history.length===0){
    el.innerHTML = '<div class="empty">Aucune partie archivée</div>';
    return;
  }
  el.innerHTML = state.history.map(g=>{
    const totals = {};
    g.rounds.forEach(r=> r.participants.forEach(pid=>{
      totals[pid]=(totals[pid]||0)+Number(r.scores[pid]||0);
    }));
    const ranked = Object.keys(totals).map(pid=>({pid,total:totals[pid]})).sort((a,b)=>b.total-a.total);
    const winner = ranked[0];
    const isOpen = expandedGames.has(g.id);
    return `
      <div class="history-item">
        <div class="history-head" data-toggle="${g.id}" style="cursor:pointer;">
          <span class="date">${g.date}</span>
          <span class="sub">${g.rounds.length} manche(s) ${isOpen ? '▲' : '▼'}</span>
        </div>
        <div class="sub">${winner ? '🏆 '+escapeHtml(playerName(winner.pid))+' — '+winner.total+' pts' : ''}</div>
        ${isOpen ? `
          <div style="margin-top:8px;">
            ${g.rounds.map((r,idx)=>`
              <table style="margin-bottom:8px;">
                <tr><th colspan="3" style="text-align:left; color:var(--sub); font-weight:600;">Manche ${idx+1}</th></tr>
                <tr><th>Joueur</th><th>Score</th><th>Donneur</th></tr>
                ${r.participants.map(pid=>`
                  <tr>
                    <td>${escapeHtml(playerName(pid))}</td>
                    <td>${r.scores[pid] ?? 0}</td>
                    <td>${r.dealerId===pid ? '🎴' : ''}</td>
                  </tr>
                `).join('')}
              </table>
            `).join('')}
            <button class="btn danger small" data-delete-game="${g.id}">Supprimer cette partie</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  el.querySelectorAll('[data-toggle]').forEach(headEl=>{
    headEl.addEventListener('click', ()=>{
      const id = headEl.dataset.toggle;
      if(expandedGames.has(id)) expandedGames.delete(id); else expandedGames.add(id);
      renderHistory();
    });
  });
  el.querySelectorAll('[data-delete-game]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.deleteGame;
      showConfirm('Supprimer définitivement cette partie de l\u2019historique ?', ()=>{
        state.history = state.history.filter(g=>g.id!==id);
        expandedGames.delete(id);
        saveState();
        renderHistory();
      });
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const data = JSON.stringify({players:state.players, currentGame:state.currentGame, history:state.history}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rami_export_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('clearHistoryBtn').addEventListener('click', ()=>{
  if(state.history.length===0){ showAlert('L\u2019historique est déjà vide.'); return; }
  showConfirm('Supprimer tout l\u2019historique des parties précédentes ? Cette action est irréversible.', ()=>{
    state.history = [];
    expandedGames.clear();
    saveState();
    renderHistory();
  });
});

// STATS
function renderStats(){
  const el = document.getElementById('statsList');
  const allGames = [...state.history];
  if(state.currentGame.rounds.length>0) allGames.push(state.currentGame);

  if(allGames.length===0 || state.players.length===0){
    el.innerHTML = '<div class="empty">Pas encore de données</div>';
    return;
  }

  const stats = {};
  state.players.forEach(p=> stats[p.id]={wins:0, gamesPlayed:0, totalScore:0} );

  allGames.forEach(g=>{
    const totals = {};
    g.rounds.forEach(r=> r.participants.forEach(pid=>{
      totals[pid]=(totals[pid]||0)+Number(r.scores[pid]||0);
    }));
    const ranked = Object.keys(totals).map(pid=>({pid,total:totals[pid]})).sort((a,b)=>b.total-a.total);
    if(ranked.length===0) return;
    const topScore = ranked[0].total;
    Object.keys(totals).forEach(pid=>{
      if(!(pid in stats)) stats[pid]={wins:0, gamesPlayed:0, totalScore:0};
      stats[pid].gamesPlayed += 1;
      stats[pid].totalScore += totals[pid];
      if(totals[pid]===topScore) stats[pid].wins += 1;
    });
  });

  el.innerHTML = Object.keys(stats).map(pid=>{
    const s = stats[pid];
    const avg = s.gamesPlayed>0 ? (s.totalScore/s.gamesPlayed).toFixed(1) : '0';
    return `
      <div class="stat-row" style="flex-direction:column; align-items:flex-start; gap:4px;">
        <strong>${escapeHtml(playerName(pid))}</strong>
        <div class="sub" style="display:flex; gap:16px; color:var(--sub); font-size:13px;">
          <span>🏆 ${s.wins} victoire(s)</span>
          <span>🎯 ${avg} pts/partie moy.</span>
          <span>${s.gamesPlayed} partie(s)</span>
        </div>
      </div>
    `;
  }).join('');
}

// MODALS
function openModal(innerHtml, onReady){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="overlay"><div class="modal">${innerHtml}</div></div>`;
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  if(onReady) onReady();
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function showConfirm(message, onConfirm){
  openModal(`
    <h3>Confirmation</h3>
    <p>${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn secondary" id="confNo">Annuler</button>
      <button class="btn danger" id="confYes">Confirmer</button>
    </div>
  `, ()=>{
    document.getElementById('confNo').addEventListener('click', closeModal);
    document.getElementById('confYes').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
  });
}
function showAlert(message){
  openModal(`
    <h3>Info</h3>
    <p>${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn" id="alertOk">OK</button>
    </div>
  `, ()=>{
    document.getElementById('alertOk').addEventListener('click', closeModal);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll(){
  document.getElementById('gameDate').value = state.currentGame.date;
  renderPlayers();
  renderRanking();
  renderRounds();
}

applyTheme();
renderAll();
</script>
</body>
</html>
